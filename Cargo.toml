[package]
name = "switchboard-rs"
version = "1.1.0"
edition = "2024"
description = "A local desktop reference library for files, folders and web links"
license = "MIT"

[lib]
name = "switchboard"
path = "src/lib.rs"

[[bin]]
name = "switchboard"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
unicode-normalization = "0.1"
unicode-segmentation = "1"
wry = "0.55"
tao = "0.35"
muda = "0.17"
rfd = "0.16"
global-hotkey = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset"] }
regex = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSString", "NSError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSImage", "NSBitmapImageRep", "NSImageRep", "NSScreen", "NSEvent", "NSRunningApplication", "libc"] }

[profile.release]
debug = 0
strip = true
