name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Set release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "APP_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - run: ./scripts/build-app.sh
      - name: Archive and checksum
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          file dist/Switchboard.app/Contents/MacOS/Switchboard | grep "$ARCH"
          ditto -c -k --sequesterRsrc --keepParent dist/Switchboard.app "dist/Switchboard-$ARCH.zip"
          cd dist
          shasum -a 256 "Switchboard-$ARCH.zip" > "Switchboard-$ARCH.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Switchboard-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/* --title "$RELEASE_TAG" --generate-notes "${args[@]}"
